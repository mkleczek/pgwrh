# SPDX-License-Identifier: AGPL-3.0-only
name: FDW regressions on PostgreSQL 18
on:
  workflow_call:
    inputs:
      source_artifact:
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        if: inputs.source_artifact == ''
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.source_artifact != ''
        with:
          name: ${{ inputs.source_artifact }}
          path: release-source
      - name: Unpack the reviewed release source
        if: inputs.source_artifact != ''
        run: tar -xzf release-source/*.tar.gz --strip-components=1
      - name: Verify the pristine upstream import workflow
        run: python3 test/pgwrh_fdw/test_upstream_import.py
      - name: Fetch the pinned PostgreSQL release
        uses: actions/checkout@v4
        with:
          repository: postgres/postgres
          ref: 62d6c7d3df6287f1bd83199c1a746e50d31571a0
          path: .ci/postgres-source
          persist-credentials: false
      - name: Install build and TAP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex zlib1g-dev libipc-run-perl
      - name: Build PostgreSQL 18.3 and stock postgres_fdw
        run: |
          cd .ci/postgres-source
          ./configure --prefix="$RUNNER_TEMP/pgsql" --without-icu --without-readline --enable-cassert
          make -j2
          make install
          make -C contrib/postgres_fdw -j2 install
          echo "PG_CONFIG=$RUNNER_TEMP/pgsql/bin/pg_config" >> "$GITHUB_ENV"
          echo "PG_SOURCE=$GITHUB_WORKSPACE/.ci/postgres-source" >> "$GITHUB_ENV"
      - name: Build, stage, and uninstall the combined and SQL-only packages
        run: make test-packaging
      - name: FDW context, upstream regression, and export checks
        run: make test-fdw
      - name: Upstream SCRAM authentication TAP
        run: make test-fdw-tap
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-18-test-logs
          path: |
            test/pgwrh_fdw/regression.diffs
            test/pgwrh_fdw/regression.out
            test/pgwrh_fdw/results/
            test/pgwrh_fdw/output_iso/
            test/pgwrh_fdw/tmp_check/
            test/pgwrh_fdw/log/
            /tmp/pgwrh-fdw-*/postgres.log
