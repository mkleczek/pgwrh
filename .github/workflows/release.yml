name: Release packages
on:
  pull_request:
    paths:
      - 'pgwrh/**'
      - 'pgwrh_ui/**'
      - 'pgwrh_fdw/**'
      - 'pgwrh_wait/**'
      - 'Makefile'
      - 'packaging/**'
      - 'examples/compose/**'
      - 'test/**'
      - '*.nix'
      - 'nix/**'
      - 'flake.lock'
      - 'VERSION'
      - '.dockerignore'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      prepare_draft:
        description: Sign artifacts and attach them to a draft release (run on the version tag)
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PREPARE_DRAFT: ${{ inputs.prepare_draft }}
          PUBLISHED_RELEASE: ${{ github.event_name == 'release' }}
          GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PREPARE_DRAFT" = true ]; then
            test "$GITHUB_REF_TYPE" = tag
            RELEASE_TAG=$GITHUB_REF_NAME
          fi
          args=(--tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT")
          if [ "$PUBLISHED_RELEASE" = true ]; then
            args+=(--github-prerelease "$GITHUB_PRERELEASE")
          fi
          python3 -m unittest discover -s test/packaging -p 'test_*.py'
          version=$(python3 packaging/check-release.py "${args[@]}")
          mkdir dist
          git archive --format=tar.gz --prefix="pgwrh-$version/" --output="dist/pgwrh-$version.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  functional:
    needs: source
    uses: ./.github/workflows/functional.yml
    with:
      source_artifact: source

  fdw:
    needs: source
    uses: ./.github/workflows/fdw.yml
    with:
      source_artifact: source

  native:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        pg: [18, 19]
        target:
          - {name: noble, image: 'ubuntu:24.04', format: deb}
          - {name: resolute, image: 'ubuntu:26.04', format: deb}
          - {name: trixie, image: 'debian:trixie-slim', format: deb}
          - {name: el9, image: 'almalinux:9', format: rpm}
        # PGDG has not yet published pg_background_19 for RPM.
        exclude:
          - pg: 19
            target: {name: el9, image: 'almalinux:9', format: rpm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with: {name: source, path: source}
      - name: Unpack the exact release sources
        run: |
          mkdir src
          tar -xzf source/*.tar.gz -C src --strip-components=1
      - name: Build and install-test native packages
        working-directory: src
        env:
          FORMAT: ${{ matrix.target.format }}
          BASE_IMAGE: ${{ matrix.target.image }}
          PG_MAJOR: ${{ matrix.pg }}
          PGDG_COMPONENTS: ${{ matrix.pg == 19 && 'main 19' || 'main' }}
          PGDG_TESTING: ${{ matrix.pg == 19 && '1' || '0' }}
        run: docker build -f "packaging/$FORMAT/Dockerfile" --build-arg "BASE_IMAGE=$BASE_IMAGE" --build-arg "PG_MAJOR=$PG_MAJOR" --build-arg "PGDG_COMPONENTS=$PGDG_COMPONENTS" --build-arg "PGDG_TESTING=$PGDG_TESTING" --output type=local,dest=../packages .
      - uses: actions/upload-artifact@v4
        with:
          name: native-pg${{ matrix.pg }}-${{ matrix.target.name }}-${{ matrix.runner }}
          path: packages/*
          if-no-files-found: error

  container:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        pg:
          - {major: 18, image: 'postgres:18.6-trixie'}
          - {major: 19, image: 'postgres:19beta3-trixie'}
        platform:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 25
    env:
      PGWRH_IMAGE: pgwrh:release-pg${{ matrix.pg.major }}-${{ matrix.platform.arch }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: source, path: source}
      - run: |
          mkdir src
          tar -xzf source/*.tar.gz -C src --strip-components=1
      - name: Build and test the installed image
        working-directory: src
        run: docker build -f packaging/container/Dockerfile --build-arg "PG_MAJOR=${{ matrix.pg.major }}" --build-arg "POSTGRES_IMAGE=${{ matrix.pg.image }}" -t "$PGWRH_IMAGE" .
      - name: Verify the documented quickstart, console and repeated setup
        working-directory: src/examples/compose
        run: |
          bash quickstart.sh
          docker compose run --rm setup
          docker compose --profile ui run --rm ui-setup
          bash quickstart.sh
      - name: Preserve demo diagnostics
        if: always()
        working-directory: src/examples/compose
        run: docker compose --profile ui logs --no-color > "$RUNNER_TEMP/compose.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-logs-pg${{ matrix.pg.major }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/compose.log
      - name: Remove the test cluster
        if: always()
        working-directory: src/examples/compose
        run: docker compose --profile ui down -v
      - name: Save the tested image
        if: github.event_name == 'release' || inputs.prepare_draft
        run: docker save "$PGWRH_IMAGE" | gzip > image-pg${{ matrix.pg.major }}-${{ matrix.platform.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release' || inputs.prepare_draft
        with:
          name: image-pg${{ matrix.pg.major }}-${{ matrix.platform.arch }}
          path: image-pg${{ matrix.pg.major }}-${{ matrix.platform.arch }}.tar.gz
          compression-level: 0

  nix:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with: {name: source, path: source}
      - run: |
          mkdir src
          tar -xzf source/*.tar.gz -C src --strip-components=1
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L ./src

  repository-test:
    needs: [source, native]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - run: |
          mkdir src
          tar -xzf artifacts/source/*.tar.gz -C src --strip-components=1
          docker build -f src/packaging/repository/Dockerfile -t pgwrh-repository-test src
          docker run --rm -v "$PWD/artifacts:/artifacts:ro" pgwrh-repository-test

  publish:
    if: github.event_name == 'release' || inputs.prepare_draft
    needs: [source, functional, fdw, native, container, nix, repository-test]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
      PRERELEASE: ${{ needs.source.outputs.prerelease }}
      SIGNING_FINGERPRINT: ${{ vars.PACKAGE_SIGNING_FINGERPRINT }}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - name: Load release tooling
        run: |
          mkdir src
          tar -xzf artifacts/source/*.tar.gz -C src --strip-components=1
          sudo apt-get update
          sudo apt-get install -y apt-utils rpm createrepo-c gnupg
      - name: Import the release signing key
        env:
          SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_FINGERPRINT"
          signing_home=$(mktemp -d)
          chmod 700 "$signing_home"
          echo "GNUPGHOME=$signing_home" >> "$GITHUB_ENV"
          printf '%s' "$SIGNING_KEY" | gpg --homedir "$signing_home" --batch --import
      - name: Prepare signed repositories and release checksums
        run: |
          python3 src/packaging/repository/build.py artifacts repository --version "$VERSION" --key "$SIGNING_FINGERPRINT"
          mkdir dist
          cp artifacts/source/*.tar.gz dist/
          find artifacts/native-* -type f \( -name '*.deb' -o -name '*.ddeb' -o -name '*.buildinfo' -o -name '*.changes' \) -exec cp '{}' dist/ \;
          find repository/rpm -name '*.rpm' -exec cp '{}' dist/ \;
          cp repository/pgwrh.asc dist/
          tar -czf "dist/pgwrh-$VERSION-repositories.tar.gz" -C repository .
          cd dist
          sha256sum ./* > SHA256SUMS
          gpg --batch --yes --local-user "$SIGNING_FINGERPRINT" --armor --detach-sign SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create or check the draft release
        if: inputs.prepare_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" --json isDraft,isPrerelease > release.json; then
            test "$(jq -r .isDraft release.json)" = true
            test "$(jq -r .isPrerelease release.json)" = "$PRERELEASE"
          else
            args=(--verify-tag --draft --title "pgwrh $VERSION" --notes-file "src/docs/releases/$VERSION.md")
            if [ "$PRERELEASE" = true ]; then
              args+=(--prerelease --latest=false)
            fi
            gh release create "v$VERSION" "${args[@]}"
          fi
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images and multi-architecture tag
        if: github.event_name == 'release'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          for major in 18 19; do
            image="ghcr.io/${REPOSITORY,,}:$VERSION-pg$major"
            for arch in amd64 arm64; do
              gunzip -c "artifacts/image-pg$major-$arch/image-pg$major-$arch.tar.gz" | docker load
              docker tag "pgwrh:release-pg$major-$arch" "$image-$arch"
              docker push "$image-$arch"
            done
            docker manifest create "$image" "$image-amd64" "$image-arm64"
            docker manifest push "$image"
          done
      - name: Attach the release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" dist/* --clobber
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'release' && needs.source.outputs.prerelease == 'false'
        with: {path: repository}
      - name: Remove the temporary signing key
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            gpgconf --kill all
            rm -rf "$GNUPGHOME"
          fi

  pages:
    needs: [source, publish]
    if: github.event_name == 'release' && needs.source.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
