name: pgwrh-demo
x-postgres: &postgres
  image: ${PGWRH_IMAGE:-ghcr.io/mkleczek/pgwrh:1.0.0-alpha1-pg18}
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: pgwrh-local-demo
    POSTGRES_DB: pgwrh_demo
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d pgwrh_demo && psql -U postgres -d pgwrh_demo -Atqc \"SELECT count(*) FROM pg_extension WHERE extname IN ('pgwrh', 'pgwrh_fdw', 'pgwrh_wait') AND extversion='1.0.0-alpha1'\" | grep -qx 3"]
    interval: 2s
    timeout: 5s
    retries: 60
  shm_size: 256mb

services:
  controller:
    <<: *postgres
    ports: ["127.0.0.1:${PGWRH_CONTROLLER_PORT:-15432}:5432"]
    volumes: ["controller:/var/lib/postgresql"]
  replica1:
    <<: *postgres
    ports: ["127.0.0.1:${PGWRH_REPLICA1_PORT:-15433}:5432"]
    volumes: ["replica1:/var/lib/postgresql"]
  replica2:
    <<: *postgres
    ports: ["127.0.0.1:${PGWRH_REPLICA2_PORT:-15434}:5432"]
    volumes: ["replica2:/var/lib/postgresql"]
  setup:
    image: ${PGWRH_IMAGE:-ghcr.io/mkleczek/pgwrh:1.0.0-alpha1-pg18}
    entrypoint: ["bash", "/demo/bootstrap.sh"]
    environment:
      PGUSER: postgres
      PGPASSWORD: pgwrh-local-demo
      PGDATABASE: pgwrh_demo
      PGCONNECT_TIMEOUT: "5"
    volumes: ["./:/demo:ro"]
    depends_on:
      controller: {condition: service_healthy}
      replica1: {condition: service_healthy}
      replica2: {condition: service_healthy}
  ui-setup:
    profiles: [ui]
    image: ${PGWRH_IMAGE:-ghcr.io/mkleczek/pgwrh:1.0.0-alpha1-pg18}
    entrypoint: ["bash", "/demo/ui-setup.sh"]
    environment:
      PGHOST: controller
      PGUSER: postgres
      PGPASSWORD: pgwrh-local-demo
      PGDATABASE: pgwrh_demo
    volumes: ["./:/demo:ro"]
    depends_on:
      setup: {condition: service_completed_successfully}
  ui:
    profiles: [ui]
    image: postgrest/postgrest:v14.16
    environment:
      PGRST_DB_URI: postgres://pgwrh_ui_authenticator:pgwrh-ui-local-demo@controller:5432/pgwrh_demo
      PGRST_DB_SCHEMAS: pgwrh_ui
      PGRST_DB_EXTRA_SEARCH_PATH: ""
      PGRST_DB_ANON_ROLE: pgwrh_ui_viewer
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: "3000"
    ports: ["127.0.0.1:${PGWRH_UI_PORT:-13000}:3000"]
    depends_on:
      ui-setup: {condition: service_completed_successfully}

volumes:
  controller:
  replica1:
  replica2:
